<!-- ================= TODAY ================= -->

<section class="section today" id="today">

  <div class="section-heading">
    <div>
      <p class="section-label">TODAY</p>

      <h2>
        What's behind<br>
        <span>the door?</span>
      </h2>
    </div>

    <p class="section-note">
      오늘의 작은 추천과<br>
      새로운 문을 확인해보세요.
    </p>
  </div>


  <div class="today-grid">

    <!-- TODAY'S SONG -->
    <button
      class="feature-card song-feature v3-card"
      onclick="showPage('song')"
    >
      <div class="feature-top">
        <span>01</span>
        <span>SONG</span>
      </div>

      <div class="feature-icon">♪</div>

      <p class="feature-label">TODAY'S SONG</p>

      <h3 id="homeSongTitle">오늘의 노래</h3>

      <p
        class="feature-description"
        id="homeSongDescription"
      >
        오늘의 문을 열어볼까요?
      </p>

      <div class="today-card-footer">
        <span>LISTEN</span>
        <span class="feature-arrow">↗</span>
      </div>
    </button>


    <!-- NEXT BIRTHDAY -->
    <button
      class="feature-card birthday-feature v3-card"
      onclick="showPage('birthday')"
    >
      <div class="feature-top">
        <span>02</span>
        <span>COUNTDOWN</span>
      </div>

      <div class="feature-icon">○</div>

      <p class="feature-label">NEXT BIRTHDAY</p>

      <h3 id="homeBirthdayMember">Birthday</h3>

      <p
        class="feature-description"
        id="homeBirthdayDate"
      >
        다음 생일을 기다리는 중
      </p>

      <div
        class="mini-dday"
        id="homeCountdown"
      >
        D-DAY
      </div>

      <div class="today-card-footer">
        <span>COUNTDOWN</span>
        <span class="feature-arrow">↗</span>
      </div>
    </button>


    <!-- TODAY'S QUIZ -->
    <button
      class="feature-card quiz-feature v3-card"
      onclick="showPage('quiz')"
    >
      <div class="feature-top">
        <span>03</span>
        <span>TEST</span>
      </div>

      <div class="feature-icon">?</div>

      <p class="feature-label">TODAY'S QUIZ</p>

      <h3>원도어 퀴즈</h3>

      <p class="feature-description">
        오늘의 문제에<br>
        도전해보세요.
      </p>

      <div class="today-card-footer">
        <span>START QUIZ</span>
        <span class="feature-arrow">↗</span>
      </div>
    </button>

  </div>


  <!-- YOUR DOOR -->

  <div class="your-door-card">

    <div class="your-door-left">

      <p class="section-label">YOUR DOOR</p>

      <h3 id="homeSelectedMember">
        아직 당신의 DOOR가 없어요.
      </h3>

      <p id="homeMyDoorMessage">
        좋아하는 멤버를 선택하고<br>
        나만의 문을 열어보세요.
      </p>

    </div>

    <button
      class="primary-button"
      onclick="showPage('mydoor')"
    >
      OPEN MY DOOR
      <span>→</span>
    </button>

  </div>

</section>
